# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-ai
    ports:
      - "5434:5432"  # maps container 5432 → host 5434
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: franzy
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
